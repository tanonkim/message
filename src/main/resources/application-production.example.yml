spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    show-sql: false
  activemq:
    broker-url: ${ACTIVEMQ_URL}

notification:
  crypto:
    key: ${CRYPTO_KEY}
    iv: ${CRYPTO_IV}
  api-keys:
    wello-api: ${API_KEY_WELLO}
  solapi:
    api-key: ${SOLAPI_API_KEY}
    api-secret: ${SOLAPI_API_SECRET}
    from-number: ${SOLAPI_FROM_NUMBER}
  nurigo:
    api-key: ${NURIGO_API_KEY}
    api-secret: ${NURIGO_API_SECRET}
    from-number: ${NURIGO_FROM_NUMBER}
  ses:
    region: ${AWS_REGION:ap-northeast-2}
    from-email: ${SES_FROM_EMAIL}
  fingerpush:
    api-key: ${FINGERPUSH_API_KEY}
    app-id: ${FINGERPUSH_APP_ID}
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL}

logging:
  level:
    com.message: INFO

resilience4j:
  circuitbreaker:
    instances:
      solapi:                          # SMS용
        slidingWindowSize: 10          # 최근 10번 호출 기준
        failureRateThreshold: 50       # 50% 이상 실패 시 OPEN
        waitDurationInOpenState: 60s   # OPEN 후 60초 대기
        permittedNumberOfCallsInHalfOpenState: 3  # HALF-OPEN에서 3번 테스트
        minimumNumberOfCalls: 5        # 최소 5번 호출 후 판단

      nurigo:                          # 알림톡용
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 60s

      ses:                             # 이메일용
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s   # AWS는 빠르게 복구되는 경우 많음

      fingerpush:                      # 푸시용
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
