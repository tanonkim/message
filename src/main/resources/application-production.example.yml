spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    show-sql: false
  activemq:
    broker-url: ${ACTIVEMQ_URL}

notification:
  crypto:
    key: ${CRYPTO_KEY}
    iv: ${CRYPTO_IV}
  api-keys:
    wello-api: ${API_KEY_WELLO}
  solapi:
    api-key: ${SOLAPI_API_KEY}
    api-secret: ${SOLAPI_API_SECRET}
    from-number: ${SOLAPI_FROM_NUMBER}
  nurigo:
    api-key: ${NURIGO_API_KEY}
    api-secret: ${NURIGO_API_SECRET}
    from-number: ${NURIGO_FROM_NUMBER}
  ses:
    region: ${AWS_REGION:ap-northeast-2}
    from-email: ${SES_FROM_EMAIL}
  fingerpush:
    api-key: ${FINGERPUSH_API_KEY}
    app-id: ${FINGERPUSH_APP_ID}
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL}

logging:
  level:
    com.message: INFO